<!doctype html>
<html lang="en" class="switch-demo-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A panel of related switches reporting what a submission carries." />
    <title>Switch - Group</title>
    <link rel="stylesheet" href="../../shared.css" />
    <script type="module" src="../../shared.js"></script>
  </head>
  <body>
    <main class="switch-demo">
      <div class="switch-demo__shell">
        <section class="switch-demo__card">
          <form novalidate>
            <fieldset class="switch-demo__fieldset">
              <legend class="switch-demo__label">Email notifications</legend>

              <div class="switch-demo__rows switch-demo__rows--split">
                <ui-switch placement="start">
                  <input type="checkbox" id="comments" name="comments" class="switch__control" checked />
                  <label for="comments">Comments on my work</label>
                </ui-switch>

                <ui-switch placement="start">
                  <input type="checkbox" id="reviews" name="reviews" class="switch__control" checked />
                  <label for="reviews">Review requests</label>
                </ui-switch>

                <ui-switch placement="start">
                  <input type="checkbox" id="releases" name="releases" class="switch__control" />
                  <label for="releases">Release notes</label>
                </ui-switch>

                <ui-switch placement="start">
                  <input type="checkbox" id="marketing" name="marketing" class="switch__control" />
                  <label for="marketing">Offers and surveys</label>
                </ui-switch>
              </div>
            </fieldset>

            <div class="switch-demo__actions">
              <button class="switch-demo__button" type="submit">Show what would be sent</button>
            </div>
          </form>

          <output class="switch-demo__output" aria-live="polite"></output>
        </section>
      </div>
    </main>
    <script type="module">
      import { initializeSwitchDemo } from '../../demo.js';

      initializeSwitchDemo({ reportForm: true });

      document.querySelector('form')?.addEventListener('submit', (event) => {
        event.preventDefault();
      });
    </script>
  </body>
</html>
