<!doctype html>
<html lang="en" class="switch-demo-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Switch rows carrying supporting text as a description." />
    <title>Switch - Descriptions</title>
    <link rel="stylesheet" href="../../shared.css" />
    <script type="module" src="../../shared.js"></script>
  </head>
  <body>
    <main class="switch-demo">
      <div class="switch-demo__shell">
        <section class="switch-demo__card">
          <p class="switch-demo__label">Privacy</p>
          <div class="switch-demo__rows switch-demo__rows--split">
            <ui-switch>
              <input type="checkbox" id="analytics" name="analytics" class="switch__control" />
              <label for="analytics">Share usage analytics</label>
              <p class="switch__description">
                Sends anonymous counts of which screens are opened. No message content ever
                leaves the device.
              </p>
            </ui-switch>

            <ui-switch>
              <input type="checkbox" id="crash" name="crash" class="switch__control" checked />
              <label for="crash">Send crash reports</label>
              <p class="switch__description">
                Includes the stack trace and the app version at the moment of the crash.
              </p>
            </ui-switch>

            <ui-switch>
              <input type="checkbox" id="personalise" name="personalise" class="switch__control" />
              <label for="personalise">Personalised suggestions</label>
              <p class="switch__description">
                Uses your recent activity to order the home screen. Turning this off clears
                what has already been collected.
              </p>
            </ui-switch>
          </div>

          <output class="switch-demo__output" aria-live="polite"></output>
        </section>
      </div>
    </main>
    <script type="module">
      import { initializeSwitchDemo } from '../../demo.js';

      initializeSwitchDemo();
    </script>
  </body>
</html>
