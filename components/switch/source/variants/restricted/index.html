<!doctype html>
<html lang="en" class="switch-demo-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Unavailable switches in both states beside a disabled group." />
    <title>Switch - Restricted</title>
    <link rel="stylesheet" href="../../shared.css" />
    <script type="module" src="../../shared.js"></script>
  </head>
  <body>
    <main class="switch-demo">
      <div class="switch-demo__shell">
        <section class="switch-demo__card">
          <form novalidate>
            <p class="switch-demo__label">Individually unavailable</p>
            <div class="switch-demo__rows switch-demo__rows--split">
              <ui-switch>
                <input type="checkbox" id="beta" name="beta" class="switch__control" disabled />
                <label for="beta">Beta features</label>
                <p class="switch__description">
                  Off and unavailable: your plan does not include the beta channel.
                </p>
              </ui-switch>

              <ui-switch>
                <input type="checkbox" id="encryption" name="encryption" class="switch__control" checked disabled />
                <label for="encryption">End-to-end encryption</label>
                <p class="switch__description">
                  On and unavailable: required by your organisation and not yours to turn off.
                </p>
              </ui-switch>
            </div>

            <p class="switch-demo__label">Disabled as a group</p>
            <fieldset class="switch-demo__fieldset" disabled>
              <legend class="switch-demo__label">Legacy sync</legend>

              <div class="switch-demo__rows switch-demo__rows--split">
                <ui-switch>
                  <input type="checkbox" id="legacy-contacts" name="legacy-contacts" class="switch__control" checked />
                  <label for="legacy-contacts">Contacts</label>
                </ui-switch>

                <ui-switch>
                  <input type="checkbox" id="legacy-calendar" name="legacy-calendar" class="switch__control" />
                  <label for="legacy-calendar">Calendar</label>
                </ui-switch>
              </div>
            </fieldset>

            <div class="switch-demo__actions">
              <button class="switch-demo__button" type="submit">Show what would be sent</button>
            </div>
          </form>

          <output class="switch-demo__output" aria-live="polite"></output>
        </section>
      </div>
    </main>
    <script type="module">
      import { initializeSwitchDemo } from '../../demo.js';

      initializeSwitchDemo({ reportForm: true });

      document.querySelector('form')?.addEventListener('submit', (event) => {
        event.preventDefault();
      });
    </script>
  </body>
</html>
