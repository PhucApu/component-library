<!doctype html>
<html lang="en" class="text-field-demo-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Text Field filled surface and sizes." />
    <title>Text Field - Filled</title>
    <link rel="stylesheet" href="../../shared.css" />
    <script type="module" src="../../shared.js"></script>
  </head>
  <body>
    <main class="text-field-demo">
      <div class="text-field-demo__shell">
        <section class="text-field-demo__card">
          <ui-text-field appearance="filled">
            <label for="project">Project</label>
            <div class="text-field__control">
              <input id="project" name="project" type="text" value="Catalog rebuild" />
            </div>
            <p class="text-field__hint">Filled, medium.</p>
          </ui-text-field>

          <ui-text-field appearance="filled" size="sm">
            <label for="ticket">Ticket</label>
            <div class="text-field__control">
              <input id="ticket" name="ticket" type="text" placeholder="UI-1024" />
            </div>
            <p class="text-field__hint">Filled, small.</p>
          </ui-text-field>

          <ui-text-field size="sm">
            <label for="branch">Branch</label>
            <div class="text-field__control">
              <input id="branch" name="branch" type="text" placeholder="feature/chips" />
            </div>
            <p class="text-field__hint">Outlined, small.</p>
          </ui-text-field>

          <p class="text-field-demo__label">Raw output</p>
          <output class="text-field-demo__output" aria-live="polite"></output>
        </section>
      </div>
    </main>
    <script type="module">
      import { initializeTextFieldDemo } from '../../demo.js';

      initializeTextFieldDemo();
    </script>
  </body>
</html>
