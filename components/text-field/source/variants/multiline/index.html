<!doctype html>
<html lang="en" class="text-field-demo-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Text Field multiline with a character counter." />
    <title>Text Field - Multiline</title>
    <link rel="stylesheet" href="../../shared.css" />
    <script type="module" src="../../shared.js"></script>
  </head>
  <body>
    <main class="text-field-demo">
      <div class="text-field-demo__shell">
        <section class="text-field-demo__card">
          <ui-text-field counter>
            <label for="summary">Summary</label>
            <div class="text-field__control">
              <textarea
                id="summary"
                name="summary"
                rows="4"
                maxlength="160"
                placeholder="What changed and why?"
              ></textarea>
            </div>
            <p class="text-field__hint">
              Up to 160 characters. The counter is decorative; the remaining count is only
              announced as you approach the limit.
            </p>
          </ui-text-field>

          <ui-text-field>
            <label for="notes">Notes</label>
            <div class="text-field__control">
              <textarea id="notes" name="notes" rows="3"></textarea>
            </div>
            <p class="text-field__hint">No limit, so no counter.</p>
          </ui-text-field>

          <p class="text-field-demo__label">Raw output</p>
          <output class="text-field-demo__output" aria-live="polite"></output>
        </section>
      </div>
    </main>
    <script type="module">
      import { initializeTextFieldDemo } from '../../demo.js';

      initializeTextFieldDemo();
    </script>
  </body>
</html>
