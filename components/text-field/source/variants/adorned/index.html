<!doctype html>
<html lang="en" class="text-field-demo-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Text Field prefix, suffix, and password reveal." />
    <title>Text Field - Adorned</title>
    <link rel="stylesheet" href="../../shared.css" />
    <script type="module" src="../../shared.js"></script>
  </head>
  <body>
    <main class="text-field-demo">
      <div class="text-field-demo__shell">
        <section class="text-field-demo__card">
          <ui-text-field>
            <label for="price">Price</label>
            <div class="text-field__control">
              <span class="text-field__prefix" aria-hidden="true">$</span>
              <input id="price" name="price" type="text" inputmode="decimal" value="49.00" />
              <span class="text-field__suffix">USD</span>
            </div>
            <p class="text-field__hint">
              The currency symbol is decorative; the unit is read out because it carries
              meaning.
            </p>
          </ui-text-field>

          <ui-text-field reveal>
            <label for="password">Password</label>
            <div class="text-field__control">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                value="correct horse battery"
              />
            </div>
            <p class="text-field__hint">
              The reveal button is a real button, and its name states what it will do next.
            </p>
          </ui-text-field>

          <p class="text-field-demo__label">Raw output</p>
          <output class="text-field-demo__output" aria-live="polite"></output>
        </section>
      </div>
    </main>
    <script type="module">
      import { initializeTextFieldDemo } from '../../demo.js';

      initializeTextFieldDemo();
    </script>
  </body>
</html>
