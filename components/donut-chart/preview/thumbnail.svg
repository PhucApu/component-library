<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="A donut chart of traffic by source with the total in the middle, beside a legend giving each source its number and its share">
  <title>Donut Chart preview</title>
  <desc>Five wedges — organic search, direct, paid search, referral and social — separated by the surface, with the total of thirty-nine thousand seven hundred in the hole and every value and share written out in the legend.</desc>

  <defs>
    <radialGradient id="glow" cx="12%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#4968e8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#4968e8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="#0f1115" />
  <rect width="640" height="360" fill="url(#glow)" />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="24" y="20" width="592" height="320" rx="16" fill="#171a20" stroke="#292d36" />

    <!-- The wedges, generated by the component's own arc geometry rather than drawn by eye.
         The gaps are the surface showing through, taken out of each wedge so they still add
         up to the whole circle. -->
    <g transform="translate(24 20)">
      <path d="M177.86 72.02A104 104 0 0 1 201.46 276.83L191.67 238.05A64 64 0 0 0 177.14 112.01Z" fill="#3987e5" />
      <path d="M197.85 277.68A104 104 0 0 1 79.34 214.37L116.52 199.61A64 64 0 0 0 189.44 238.57Z" fill="#d95926" />
      <path d="M78.03 210.9A104 104 0 0 1 90.83 116.32L123.59 139.27A64 64 0 0 0 115.71 197.48Z" fill="#199e70" />
      <path d="M93.02 113.31A104 104 0 0 1 139.55 78.6L153.57 116.06A64 64 0 0 0 124.93 137.42Z" fill="#c98500" />
      <path d="M143.05 77.36A104 104 0 0 1 174.14 72.02L174.86 112.01A64 64 0 0 0 155.72 115.3Z" fill="#d55181" />
    </g>

    <!-- The hole is the whole reason to draw a ring: it is the one place a part-to-whole
         chart can put the number the parts are parts of. -->
    <text x="200" y="186" fill="#a8afbc" font-size="12" font-weight="600" text-anchor="middle">Total</text>
    <text x="200" y="214" fill="#f4f6fa" font-size="26" font-weight="650" text-anchor="middle">39,700</text>

    <!-- The legend carries the numbers, because a ring is read by angle and nobody reads angle
         accurately. This is the part somebody actually reads. -->
    <g font-size="13">
      <rect x="352" y="86" width="11" height="11" rx="3" fill="#3987e5" />
      <text x="372" y="96" fill="#cbd1dc">Organic search</text>
      <text x="536" y="96" fill="#f4f6fa" text-anchor="end">18,400</text>
      <text x="592" y="96" fill="#a8afbc" text-anchor="end">46.3%</text>

      <rect x="352" y="126" width="11" height="11" rx="3" fill="#d95926" />
      <text x="372" y="136" fill="#cbd1dc">Direct</text>
      <text x="536" y="136" fill="#f4f6fa" text-anchor="end">9,100</text>
      <text x="592" y="136" fill="#a8afbc" text-anchor="end">22.9%</text>

      <rect x="352" y="166" width="11" height="11" rx="3" fill="#199e70" />
      <text x="372" y="176" fill="#cbd1dc">Paid search</text>
      <text x="536" y="176" fill="#f4f6fa" text-anchor="end">6,250</text>
      <text x="592" y="176" fill="#a8afbc" text-anchor="end">15.7%</text>

      <rect x="352" y="206" width="11" height="11" rx="3" fill="#c98500" />
      <text x="372" y="216" fill="#cbd1dc">Referral</text>
      <text x="536" y="216" fill="#f4f6fa" text-anchor="end">3,800</text>
      <text x="592" y="216" fill="#a8afbc" text-anchor="end">9.6%</text>

      <rect x="352" y="246" width="11" height="11" rx="3" fill="#d55181" />
      <text x="372" y="256" fill="#cbd1dc">Social</text>
      <text x="536" y="256" fill="#f4f6fa" text-anchor="end">2,150</text>
      <text x="592" y="256" fill="#a8afbc" text-anchor="end">5.4%</text>
    </g>

    <text x="352" y="300" fill="#a8afbc" font-size="12">Traffic by source</text>
  </g>
</svg>
