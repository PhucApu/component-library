      <rect x="96" y="192" width="26" height="26" rx="5" fill="#1c5cab" />
      <rect x="128" y="192" width="26" height="26" rx="5" fill="#1c5cab" />
      <rect x="160" y="192" width="26" height="26" rx="5" fill="#104281" />
      <rect x="192" y="192" width="26" height="26" rx="5" fill="#5598e7" />
      <rect x="224" y="192" width="26" height="26" rx="5" fill="#2a78d6" />
