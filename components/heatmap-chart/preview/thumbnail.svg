      <rect x="416" y="192" width="26" height="26" rx="5" fill="#5598e7" />
      <rect x="448" y="192" width="26" height="26" rx="5" fill="#1c5cab" />
      <rect x="96" y="224" width="26" height="26" rx="5" fill="#104281" />
      <rect x="128" y="224" width="26" height="26" rx="5" fill="#1c5cab" />
      <rect x="160" y="224" width="26" height="26" rx="5" fill="#212734" />
