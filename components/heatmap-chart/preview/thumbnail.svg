      <rect x="384" y="256" width="26" height="26" rx="5" fill="#104281" />
      <rect x="416" y="256" width="26" height="26" rx="5" fill="#104281" />
      <rect x="96" y="288" width="26" height="26" rx="5" fill="#212734" />
      <rect x="128" y="288" width="26" height="26" rx="5" fill="#212734" />
      <rect x="160" y="288" width="26" height="26" rx="5" fill="#212734" />
      <rect x="192" y="288" width="26" height="26" rx="5" fill="#104281" />
      <rect x="224" y="288" width="26" height="26" rx="5" fill="#212734" />
      <rect x="256" y="288" width="26" height="26" rx="5" fill="#212734" />
      <rect x="288" y="288" width="26" height="26" rx="5" fill="#212734" />
      <rect x="320" y="288" width="26" height="26" rx="5" fill="#212734" />
      <rect x="352" y="288" width="26" height="26" rx="5" fill="#212734" />
      <rect x="384" y="288" width="26" height="26" rx="5" fill="#212734" />
      <rect x="416" y="288" width="26" height="26" rx="5" fill="#104281" />
    </g>

    <!-- The scale is never optional here: a colour meaning "a lot" says nothing until the
         reader is told how much a lot is. -->
    <g font-size="11">
      <text x="404" y="316" fill="#a8afbc" text-anchor="end">Less</text>
      <rect x="412" y="307" width="12" height="12" rx="3" fill="#212734" />
      <rect x="430" y="307" width="12" height="12" rx="3" fill="#104281" />
      <rect x="448" y="307" width="12" height="12" rx="3" fill="#1c5cab" />
