      <rect x="96" y="160" width="26" height="26" rx="5" fill="#1c5cab" />
      <rect x="128" y="160" width="26" height="26" rx="5" fill="#2a78d6" />
      <rect x="160" y="160" width="26" height="26" rx="5" fill="#104281" />
      <rect x="192" y="160" width="26" height="26" rx="5" fill="#86b6ef" />
      <rect x="224" y="160" width="26" height="26" rx="5" fill="#5598e7" />
      <rect x="256" y="160" width="26" height="26" rx="5" fill="#1c5cab" />
