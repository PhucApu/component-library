<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="An activity calendar of twelve weeks by seven weekdays, shaded from quiet to busy, with a scale beneath it">
  <title>Heatmap Chart calendar preview</title>
  <desc>Weeks run across and weekdays down. Quiet days carry the faintest square, busy midweek days the brightest, and the final weekend has no squares at all because those days have not happened yet.</desc>

  <defs>
    <radialGradient id="glow" cx="12%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#4968e8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#4968e8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="#0f1115" />
  <rect width="640" height="360" fill="url(#glow)" />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="24" y="20" width="592" height="320" rx="16" fill="#171a20" stroke="#292d36" />

    <text x="48" y="52" fill="#a8afbc" font-size="12" font-weight="650">Commits over the last twelve weeks</text>

    <g fill="#a8afbc" font-size="10" text-anchor="middle">
      <text x="109" y="84">W1</text>
      <text x="205" y="84">W4</text>
      <text x="301" y="84">W7</text>
      <text x="397" y="84">W10</text>
    </g>

    <g fill="#a8afbc" font-size="10" text-anchor="end">
      <text x="86" y="114">Mon</text>
      <text x="86" y="178">Wed</text>
      <text x="86" y="242">Fri</text>
      <text x="86" y="306">Sun</text>
    </g>

    <!-- Every square placed by the component's own binning rather than by eye. The bottom
         right corner has no squares: those days have not happened, which is not the same as
         days on which nothing happened. -->
    <g>
      <rect x="96" y="96" width="26" height="26" rx="5" fill="#104281" />
      <rect x="128" y="96" width="26" height="26" rx="5" fill="#1c5cab" />
      <rect x="160" y="96" width="26" height="26" rx="5" fill="#212734" />
      <rect x="192" y="96" width="26" height="26" rx="5" fill="#2a78d6" />
      <rect x="224" y="96" width="26" height="26" rx="5" fill="#2a78d6" />
      <rect x="256" y="96" width="26" height="26" rx="5" fill="#104281" />
      <rect x="288" y="96" width="26" height="26" rx="5" fill="#2a78d6" />
      <rect x="320" y="96" width="26" height="26" rx="5" fill="#1c5cab" />
      <rect x="352" y="96" width="26" height="26" rx="5" fill="#212734" />
      <rect x="384" y="96" width="26" height="26" rx="5" fill="#1c5cab" />
      <rect x="416" y="96" width="26" height="26" rx="5" fill="#5598e7" />
      <rect x="448" y="96" width="26" height="26" rx="5" fill="#1c5cab" />
      <rect x="96" y="128" width="26" height="26" rx="5" fill="#1c5cab" />
      <rect x="128" y="128" width="26" height="26" rx="5" fill="#2a78d6" />
      <rect x="160" y="128" width="26" height="26" rx="5" fill="#104281" />
