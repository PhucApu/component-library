<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="A breadcrumb trail with its middle levels behind an expand button">
  <defs>
    <radialGradient id="glow" cx="12%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#4968e8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#4968e8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="#0f1115" />
  <rect width="640" height="360" fill="url(#glow)" />

  <rect x="48" y="60" width="544" height="240" rx="18" fill="#171a20" stroke="#292d36" />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="76" y="98" fill="#a8afbc" font-size="13" font-weight="650">Six levels, four put away</text>

    <rect x="76" y="118" width="488" height="52" rx="12" fill="#10131a" stroke="#292d36" />
    <text x="100" y="150" fill="#c2cad8" font-size="15">Workspace</text>
    <text x="180" y="150" fill="#6f7889" font-size="15">/</text>
    <rect x="196" y="134" width="34" height="24" rx="6" fill="none" stroke="#6f7889" />
    <text x="213" y="150" fill="#c2cad8" font-size="15" text-anchor="middle">…</text>
    <text x="242" y="150" fill="#6f7889" font-size="15">/</text>
    <text x="258" y="150" fill="#f4f6fa" font-size="15" font-weight="650">Invoices</text>

    <text x="76" y="204" fill="#a8afbc" font-size="13" font-weight="650">Two levels shown either side</text>

    <rect x="76" y="224" width="488" height="52" rx="12" fill="#10131a" stroke="#292d36" />
    <text x="100" y="256" fill="#c2cad8" font-size="15">Workspace</text>
    <text x="180" y="256" fill="#6f7889" font-size="15">/</text>
    <text x="196" y="256" fill="#c2cad8" font-size="15">Engineering</text>
    <text x="288" y="256" fill="#6f7889" font-size="15">/</text>
    <rect x="304" y="240" width="34" height="24" rx="6" fill="none" stroke="#6f7889" />
    <text x="321" y="256" fill="#c2cad8" font-size="15" text-anchor="middle">…</text>
    <text x="350" y="256" fill="#6f7889" font-size="15">/</text>
    <text x="366" y="256" fill="#c2cad8" font-size="15">Billing</text>
    <text x="418" y="256" fill="#6f7889" font-size="15">/</text>
    <text x="434" y="256" fill="#f4f6fa" font-size="15" font-weight="650">Invoices</text>
  </g>
</svg>
