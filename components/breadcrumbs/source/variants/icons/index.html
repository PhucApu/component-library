<!doctype html>
<html lang="en" class="breadcrumbs-demo-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Levels carrying a leading icon." />
    <title>Breadcrumbs - Icons</title>
    <link rel="stylesheet" href="../../shared.css" />
    <script type="module" src="../../shared.js"></script>
  </head>
  <body>
    <main class="breadcrumbs-demo">
      <div class="breadcrumbs-demo__shell">
        <section class="breadcrumbs-demo__card">
          <p class="breadcrumbs-demo__label">An icon beside the words</p>
          <p class="breadcrumbs-demo__note">
            Each icon repeats what the label already says, so all of them are hidden from
            assistive technology. An icon that carried meaning of its own would need a name
            instead.
          </p>

          <div class="breadcrumbs-demo__frame">
            <ui-breadcrumbs separator="chevron">
              <nav aria-label="Breadcrumb">
                <ol class="breadcrumbs__list">
                  <li>
                    <a href="#home">
                      <svg class="breadcrumbs__icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z"></path>
                      </svg>
                      Home
                    </a>
                  </li>
                  <li>
                    <a href="#folder">
                      <svg class="breadcrumbs__icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"></path>
                      </svg>
                      Documents
                    </a>
                  </li>
                  <li>
                    <a href="#file" aria-current="page">
                      <svg class="breadcrumbs__icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 3h8l4 4v14H6Z"></path>
                        <path d="M14 3v4h4"></path>
                      </svg>
                      Q4 summary
                    </a>
                  </li>
                </ol>
              </nav>
            </ui-breadcrumbs>
          </div>

          <output class="breadcrumbs-demo__output" aria-live="polite"></output>
        </section>
      </div>
    </main>
    <script type="module">
      import { initializeBreadcrumbsDemo } from '../../demo.js';

      initializeBreadcrumbsDemo();
    </script>
  </body>
</html>
