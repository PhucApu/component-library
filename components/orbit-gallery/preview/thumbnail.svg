    <linearGradient id="orbit-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d8a72" />
      <stop offset="100%" stop-color="#2c4335" />
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="#0f1115" />
