  <rect x="48" y="34" width="544" height="292" rx="18" fill="#171a20" stroke="#292d36" />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="76" y="68" fill="#a8afbc" font-size="13" font-weight="650">Pictures on a ring, and the one you point at</text>

    <ellipse cx="320" cy="214" rx="212" ry="46" fill="none" stroke="#2e3440" stroke-dasharray="5 7" />

    <g opacity="0.34">
      <path d="M126 176l38 12v66l-38-12z" fill="url(#orbit-far)" stroke="#2e3440" />
      <path d="M514 176l-38 12v66l38-12z" fill="url(#orbit-far)" stroke="#2e3440" />
    </g>

    <g opacity="0.72">
      <path d="M176 166l72 16v82l-72-16z" fill="url(#orbit-side)" stroke="#2e3440" />
      <path d="M464 166l-72 16v82l72-16z" fill="url(#orbit-side)" stroke="#2e3440" />
