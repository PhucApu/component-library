<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Pictures standing on a ring in perspective, with the front one lifted towards the viewer">
  <defs>
    <radialGradient id="orbit-glow" cx="12%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#4968e8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#4968e8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="orbit-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7b267" />
      <stop offset="100%" stop-color="#c0472b" />
    </linearGradient>
    <linearGradient id="orbit-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b8fb0" />
      <stop offset="100%" stop-color="#1f3f57" />
