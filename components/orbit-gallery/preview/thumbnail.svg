    <rect x="262" y="132" width="116" height="126" rx="10" fill="url(#orbit-front)" stroke="#3b414c" />
    <path d="M262 214l30-26 24 18 22-16 40 30v28a10 10 0 0 1-10 10h-96a10 10 0 0 1-10-10z" fill="#5c2620" />
    <circle cx="348" cy="164" r="14" fill="#ffe0a3" opacity="0.9" />

    <g fill="#86a0ff">
      <circle cx="320" cy="292" r="4" />
      <rect x="286" y="288" width="22" height="8" rx="4" opacity="0.45" />
      <rect x="332" y="288" width="22" height="8" rx="4" opacity="0.45" />
