<!doctype html>
<html lang="en" class="chip-demo-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chip filter toggle example." />
    <title>Chip - Filter</title>
    <link rel="stylesheet" href="../../shared.css" />
    <script type="module" src="../../shared.js"></script>
  </head>
  <body>
    <main class="chip-demo">
      <div class="chip-demo__shell">
        <section class="chip-demo__card">
          <p class="chip-demo__label">Filter by status</p>
          <div class="chip-demo__row">
            <ui-chip selected>
              <button type="button" aria-pressed="true">
                <svg class="chip__check" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="m20 6-11 11-5-5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                </svg>
                Open
              </button>
            </ui-chip>
            <ui-chip>
              <button type="button" aria-pressed="false">
                <svg class="chip__check" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="m20 6-11 11-5-5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                </svg>
                In review
              </button>
            </ui-chip>
            <ui-chip>
              <button type="button" aria-pressed="false">
                <svg class="chip__check" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="m20 6-11 11-5-5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                </svg>
                Shipped
              </button>
            </ui-chip>
          </div>
          <p class="chip-demo__label">
            State is reported through aria-pressed and shown with a check as well as the
            surface, so it never depends on colour alone.
          </p>
          <output class="chip-demo__output" aria-live="polite">selected: Open</output>
        </section>
      </div>
    </main>
    <script type="module">
      import { initializeChipDemo } from '../../demo.js';

      initializeChipDemo();
    </script>
  </body>
</html>
