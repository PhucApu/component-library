<!doctype html>
<html lang="en" class="chip-demo-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chip filled and outlined appearances across intents and sizes." />
    <title>Chip - Appearance</title>
    <link rel="stylesheet" href="../../shared.css" />
    <script type="module" src="../../shared.js"></script>
  </head>
  <body>
    <main class="chip-demo">
      <div class="chip-demo__shell">
        <section class="chip-demo__card">
          <p class="chip-demo__label">Filled</p>
          <div class="chip-demo__row">
            <ui-chip><span>Neutral</span></ui-chip>
            <ui-chip intent="accent"><span>Accent</span></ui-chip>
            <ui-chip intent="success"><span>Success</span></ui-chip>
            <ui-chip intent="warning"><span>Warning</span></ui-chip>
            <ui-chip intent="danger"><span>Danger</span></ui-chip>
          </div>

          <p class="chip-demo__label">Outlined</p>
          <div class="chip-demo__row">
            <ui-chip appearance="outlined"><span>Neutral</span></ui-chip>
            <ui-chip appearance="outlined" intent="accent"><span>Accent</span></ui-chip>
            <ui-chip appearance="outlined" intent="success"><span>Success</span></ui-chip>
            <ui-chip appearance="outlined" intent="warning"><span>Warning</span></ui-chip>
            <ui-chip appearance="outlined" intent="danger"><span>Danger</span></ui-chip>
          </div>

          <p class="chip-demo__label">Small</p>
          <div class="chip-demo__row">
            <ui-chip size="sm"><span>Neutral</span></ui-chip>
            <ui-chip size="sm" intent="accent"><span>Accent</span></ui-chip>
            <ui-chip size="sm" intent="success"><span>Success</span></ui-chip>
            <ui-chip size="sm" intent="warning"><span>Warning</span></ui-chip>
            <ui-chip size="sm" intent="danger"><span>Danger</span></ui-chip>
            <ui-chip size="sm" removable><span>Removable</span></ui-chip>
          </div>

          <p class="chip-demo__label">Disabled</p>
          <div class="chip-demo__row">
            <ui-chip disabled><span>Neutral</span></ui-chip>
            <ui-chip disabled appearance="outlined" intent="danger"><span>Danger</span></ui-chip>
            <ui-chip disabled removable><span>Removable</span></ui-chip>
          </div>
          <output class="chip-demo__output" aria-live="polite">nothing yet</output>
        </section>
      </div>
    </main>
    <script type="module">
      import { initializeChipDemo } from '../../demo.js';

      initializeChipDemo();
    </script>
  </body>
</html>
