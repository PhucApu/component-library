<!doctype html>
<html lang="en" class="chip-demo-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chip removable token example." />
    <title>Chip - Removable</title>
    <link rel="stylesheet" href="../../shared.css" />
    <script type="module" src="../../shared.js"></script>
  </head>
  <body>
    <main class="chip-demo">
      <div class="chip-demo__shell">
        <section class="chip-demo__card">
          <p class="chip-demo__label">Recipients</p>
          <div class="chip-demo__row">
            <ui-chip removable><span>Ha Linh</span></ui-chip>
            <ui-chip removable><span>Minh Quan</span></ui-chip>
            <ui-chip removable intent="accent"><span>Design team</span></ui-chip>
            <ui-chip removable disabled><span>Owner</span></ui-chip>
          </div>
          <p class="chip-demo__label">
            Each remove button is named after its own chip, and Backspace or Delete removes
            the chip while focus is inside it.
          </p>
          <output class="chip-demo__output" aria-live="polite">nothing yet</output>
        </section>
      </div>
    </main>
    <script type="module">
      import { initializeChipDemo } from '../../demo.js';

      initializeChipDemo();
    </script>
  </body>
</html>
