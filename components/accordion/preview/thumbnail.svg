<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="A group of disclosure panels with the first one open">
  <defs>
    <radialGradient id="glow" cx="12%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#4968e8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#4968e8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="#0f1115" />
  <rect width="640" height="360" fill="url(#glow)" />

  <rect x="48" y="40" width="544" height="280" rx="18" fill="#171a20" stroke="#292d36" />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="76" y="76" fill="#a8afbc" font-size="13" font-weight="650">Panels that open and close on their own</text>

    <rect x="76" y="94" width="488" height="200" rx="12" fill="#171a20" stroke="#2e3440" />

    <path d="M76 106a12 12 0 0 1 12-12h464a12 12 0 0 1 12 12v34H76z" fill="#1a1e26" />
    <text x="100" y="126" fill="#f4f6fa" font-size="15" font-weight="650">What the component adds</text>
    <path d="M528 118l8 8 8-8" fill="none" stroke="#a8afbc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 536 122)" />

    <text x="100" y="166" fill="#a8afbc" font-size="13">A height that moves instead of jumping, a heading</text>
    <text x="100" y="186" fill="#a8afbc" font-size="13">for every summary, and a region for every panel.</text>

    <rect x="76" y="206" width="488" height="1" fill="#2e3440" />
    <rect x="76" y="207" width="488" height="43" fill="#1a1e26" />
    <text x="100" y="234" fill="#f4f6fa" font-size="15" font-weight="650">What the browser already did</text>
    <path d="M528 226l8 8 8-8" fill="none" stroke="#a8afbc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <rect x="76" y="250" width="488" height="1" fill="#2e3440" />
    <path d="M76 251h488v31a12 12 0 0 1-12 12H88a12 12 0 0 1-12-12z" fill="#1a1e26" />
    <text x="100" y="278" fill="#f4f6fa" font-size="15" font-weight="650">Writing the markup</text>
    <path d="M528 270l8 8 8-8" fill="none" stroke="#a8afbc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
