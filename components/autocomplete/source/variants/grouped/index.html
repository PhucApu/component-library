<!doctype html>
<html lang="en" class="autocomplete-demo-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Autocomplete grouped options example." />
    <title>Autocomplete - Grouped</title>
    <link rel="stylesheet" href="../../shared.css" />
    <script type="module" src="../../shared.js"></script>
  </head>
  <body>
    <main class="autocomplete-demo">
      <div class="autocomplete-demo__shell">
        <section class="autocomplete-demo__card" aria-labelledby="grouped-demo-label">
          <p id="grouped-demo-label" class="autocomplete-demo__label">Office</p>
          <ui-autocomplete
            mode="single"
            placeholder="Search an office"
            aria-label="Choose an office"
          >
            <optgroup label="Viet Nam">
              <option value="hanoi">Ha Noi</option>
              <option value="danang">Da Nang</option>
              <option value="hcmc">Ho Chi Minh City</option>
            </optgroup>
            <optgroup label="Japan">
              <option value="osaka">Osaka</option>
              <option value="kyoto">Kyoto</option>
              <option value="sapporo" disabled>Sapporo</option>
            </optgroup>
            <optgroup label="Europe">
              <option value="paris">Paris</option>
              <option value="berlin">Berlin</option>
            </optgroup>
          </ui-autocomplete>
          <p class="autocomplete-demo__label">Raw output</p>
          <output class="autocomplete-demo__output" aria-live="polite">""</output>
        </section>
      </div>
    </main>
    <script type="module">
      import { initializeAutocompleteDemo } from '../../demo.js';

      initializeAutocompleteDemo();
    </script>
  </body>
</html>
