<!doctype html>
<html lang="en" class="autocomplete-demo-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Autocomplete multiple selection example." />
    <title>Autocomplete - Multiple</title>
    <link rel="stylesheet" href="../../shared.css" />
    <script type="module" src="../../shared.js"></script>
  </head>
  <body>
    <main class="autocomplete-demo">
      <div class="autocomplete-demo__shell">
        <section class="autocomplete-demo__card" aria-labelledby="multiple-demo-label">
          <p id="multiple-demo-label" class="autocomplete-demo__label">Skills</p>
          <ui-autocomplete
            mode="multiple"
            value='["css","accessibility"]'
            placeholder="Add a skill"
            aria-label="Choose the required skills"
          >
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="javascript">JavaScript</option>
            <option value="accessibility">Accessibility</option>
            <option value="performance">Performance</option>
            <option value="testing">Testing</option>
            <option value="design-systems">Design systems</option>
            <option value="documentation">Documentation</option>
          </ui-autocomplete>
          <p class="autocomplete-demo__label">Raw output</p>
          <output class="autocomplete-demo__output" aria-live="polite">""</output>
        </section>
      </div>
    </main>
    <script type="module">
      import { initializeAutocompleteDemo } from '../../demo.js';

      initializeAutocompleteDemo();
    </script>
  </body>
</html>
