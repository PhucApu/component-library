<!doctype html>
<html lang="en" class="radio-group-demo-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Radio Group required state with an error message." />
    <title>Radio Group - Validation</title>
    <link rel="stylesheet" href="../../shared.css" />
    <script type="module" src="../../shared.js"></script>
  </head>
  <body>
    <main class="radio-group-demo">
      <div class="radio-group-demo__shell">
        <section class="radio-group-demo__card">
          <ui-radio-group name="contact" error="Choose how we should reach you.">
            <fieldset>
              <legend>Preferred contact method</legend>
              <div class="radio-group__options">
                <label>
                  <input type="radio" name="contact" value="email" required />
                  <span class="radio-group__text">Email</span>
                </label>
                <label>
                  <input type="radio" name="contact" value="phone" required />
                  <span class="radio-group__text">Phone</span>
                </label>
                <label>
                  <input type="radio" name="contact" value="post" required />
                  <span class="radio-group__text">Post</span>
                </label>
              </div>
            </fieldset>
          </ui-radio-group>
          <p class="radio-group-demo__label">Raw output</p>
          <output class="radio-group-demo__output" aria-live="polite">""</output>
        </section>
      </div>
    </main>
    <script type="module">
      import { initializeRadioGroupDemo } from '../../demo.js';

      initializeRadioGroupDemo({ clearErrorOnChange: true });
    </script>
  </body>
</html>
