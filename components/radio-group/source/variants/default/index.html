<!doctype html>
<html lang="en" class="radio-group-demo-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Radio Group vertical selection example." />
    <title>Radio Group - Default</title>
    <link rel="stylesheet" href="../../shared.css" />
    <script type="module" src="../../shared.js"></script>
  </head>
  <body>
    <main class="radio-group-demo">
      <div class="radio-group-demo__shell">
        <section class="radio-group-demo__card">
          <ui-radio-group name="delivery" value="standard">
            <fieldset>
              <legend>Delivery speed</legend>
              <div class="radio-group__options">
                <label>
                  <input type="radio" name="delivery" value="standard" />
                  <span class="radio-group__text">Standard</span>
                </label>
                <label>
                  <input type="radio" name="delivery" value="express" />
                  <span class="radio-group__text">Express</span>
                </label>
                <label>
                  <input type="radio" name="delivery" value="overnight" />
                  <span class="radio-group__text">Overnight</span>
                </label>
              </div>
            </fieldset>
          </ui-radio-group>
          <p class="radio-group-demo__label">Raw output</p>
          <output class="radio-group-demo__output" aria-live="polite">""</output>
        </section>
      </div>
    </main>
    <script type="module">
      import { initializeRadioGroupDemo } from '../../demo.js';

      initializeRadioGroupDemo();
    </script>
  </body>
</html>
