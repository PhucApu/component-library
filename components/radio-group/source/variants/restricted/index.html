<!doctype html>
<html lang="en" class="radio-group-demo-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Radio Group unavailable options and a disabled group." />
    <title>Radio Group - Restricted</title>
    <link rel="stylesheet" href="../../shared.css" />
    <script type="module" src="../../shared.js"></script>
  </head>
  <body>
    <main class="radio-group-demo">
      <div class="radio-group-demo__shell">
        <section class="radio-group-demo__card">
          <ui-radio-group name="room" value="single">
            <fieldset>
              <legend>Room type</legend>
              <div class="radio-group__options">
                <label>
                  <input type="radio" name="room" value="single" />
                  <span class="radio-group__text">Single</span>
                </label>
                <label>
                  <input type="radio" name="room" value="double" />
                  <span class="radio-group__text">Double</span>
                </label>
                <label>
                  <input type="radio" name="room" value="suite" disabled />
                  <span class="radio-group__text">
                    Suite
                    <small>Sold out for these dates.</small>
                  </span>
                </label>
              </div>
            </fieldset>
          </ui-radio-group>

          <p class="radio-group-demo__label">Disabled group</p>
          <ui-radio-group name="upgrade" value="none" disabled>
            <fieldset>
              <legend>Upgrade</legend>
              <div class="radio-group__options">
                <label>
                  <input type="radio" name="upgrade" value="none" />
                  <span class="radio-group__text">No upgrade</span>
                </label>
                <label>
                  <input type="radio" name="upgrade" value="balcony" />
                  <span class="radio-group__text">Balcony</span>
                </label>
              </div>
            </fieldset>
          </ui-radio-group>

          <p class="radio-group-demo__label">Raw output</p>
          <output class="radio-group-demo__output" aria-live="polite">""</output>
        </section>
      </div>
    </main>
    <script type="module">
      import { initializeRadioGroupDemo } from '../../demo.js';

      initializeRadioGroupDemo();
    </script>
  </body>
</html>
