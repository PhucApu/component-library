<!doctype html>
<html lang="en" class="temporal-demo-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Temporal Picker bounded local datetime selection example."
    />
    <title>Temporal Picker - Bounded Datetime</title>
    <link rel="stylesheet" href="../../shared.css" />
    <script type="module" src="../../shared.js"></script>
  </head>
  <body>
    <main class="temporal-demo">
      <div class="temporal-demo__shell">
        <section class="temporal-demo__card" aria-labelledby="bounded-demo-label">
          <p id="bounded-demo-label" class="temporal-demo__label">Service window</p>
          <temporal-picker
            mode="datetime"
            value="2027-09-18T08:45:30"
            min="2027-09-10T07:00:00"
            max="2027-09-24T18:00:00"
            current-indicator="off"
            locale="en-US"
            week-starts-on="1"
            placement="auto"
            aria-label="Choose a service date and time"
          ></temporal-picker>
          <p class="temporal-demo__label">Raw output</p>
          <output class="temporal-demo__output" aria-live="polite">
            2027-09-18T08:45:30
          </output>
        </section>
      </div>
    </main>
    <script type="module">
      import { initializeTemporalDemo } from '../../demo.js';

      initializeTemporalDemo();
    </script>
  </body>
</html>
