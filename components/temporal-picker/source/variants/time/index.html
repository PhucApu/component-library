<!doctype html>
<html lang="en" class="temporal-demo-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Temporal Picker 24-hour time selection example." />
    <title>Temporal Picker - Time</title>
    <link rel="stylesheet" href="../../shared.css" />
    <script type="module" src="../../shared.js"></script>
  </head>
  <body>
    <main class="temporal-demo">
      <div class="temporal-demo__shell">
        <section class="temporal-demo__card" aria-labelledby="time-demo-label">
          <p id="time-demo-label" class="temporal-demo__label">Start time</p>
          <temporal-picker
            mode="time"
            value="08:45:30"
            locale="en-US"
            aria-label="Choose a start time"
          ></temporal-picker>
          <p class="temporal-demo__label">Raw output</p>
          <output class="temporal-demo__output" aria-live="polite">08:45:30</output>
        </section>
      </div>
    </main>
    <script type="module">
      import { initializeTemporalDemo } from '../../demo.js';

      initializeTemporalDemo();
    </script>
  </body>
</html>
