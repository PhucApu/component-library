<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Temporal Picker datetime preview</title>
  <desc id="description">An open datetime picker showing September 2027 with the date 18 selected, and a row of Hour, Minute and Second fields set to 08:45:30 sitting to the right of the calendar behind a vertical rule, above a Today, Clear and Apply row.</desc>
  <style>
    text {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .muted {
      fill: #7f8795;
    }

    .outside {
      fill: #4d535f;
    }

    .day {
      fill: #e7e9ee;
      font-size: 10.5px;
      text-anchor: middle;
    }

    .field-label {
      fill: #7f8795;
      font-size: 8px;
      font-weight: 650;
    }

    .field-value {
      fill: #f4f6fa;
      font-size: 10.5px;
      font-weight: 600;
      text-anchor: middle;
    }
  </style>

  <rect width="640" height="360" rx="24" fill="#0f1115"/>

  <g aria-hidden="true">
    <rect x="60" y="18" width="520" height="44" rx="12" fill="#181a20" stroke="#7184ff" stroke-width="2"/>
    <rect x="58" y="16" width="524" height="48" rx="14" fill="none" stroke="#7184ff" stroke-opacity=".18" stroke-width="4"/>

    <rect x="80" y="32" width="16" height="15" rx="3" fill="none" stroke="#d9dde6" stroke-width="1.5"/>
    <path d="M84 29.5v5M92 29.5v5M80 37h16" fill="none" stroke="#d9dde6" stroke-linecap="round" stroke-width="1.5"/>
    <text x="110" y="45" fill="#f4f6fa" font-size="13" font-weight="560">09/18/2027 08:45:30</text>
    <path d="m552 38 4 4 4-4" fill="none" stroke="#9aa1ad" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>

    <rect x="60" y="72" width="520" height="260" rx="14" fill="#181a20" stroke="#343842" stroke-width="1.5"/>

    <!-- The calendar keeps the left column and its cells keep their full size. -->
    <path d="m86 104 5-5m-5 5 5 5" fill="none" stroke="#777f8e" stroke-linecap="round" stroke-width="1.7"/>
    <path d="m365 99 5 5-5 5" fill="none" stroke="#777f8e" stroke-linecap="round" stroke-width="1.7"/>
    <text x="228" y="108" fill="#f4f6fa" font-size="13" font-weight="650" text-anchor="middle">
      <tspan>September</tspan>
      <tspan dx="7">2027</tspan>
    </text>

    <g class="muted" font-size="8" font-weight="700" text-anchor="middle">
      <text x="98" y="132">MON</text>
      <text x="141" y="132">TUE</text>
      <text x="184" y="132">WED</text>
      <text x="228" y="132">THU</text>
      <text x="271" y="132">FRI</text>
      <text x="315" y="132">SAT</text>
      <text x="358" y="132">SUN</text>
    </g>

    <g class="day">
      <text class="outside" x="98" y="154">30</text>
      <text class="outside" x="141" y="154">31</text>
      <text x="184" y="154">1</text>
      <text x="228" y="154">2</text>
      <text x="271" y="154">3</text>
      <text x="315" y="154">4</text>
      <text x="358" y="154">5</text>

      <text x="98" y="176">6</text>
      <text x="141" y="176">7</text>
      <text x="184" y="176">8</text>
      <text x="228" y="176">9</text>
      <text x="271" y="176">10</text>
      <text x="315" y="176">11</text>
      <text x="358" y="176">12</text>

      <text x="98" y="198">13</text>
      <text x="141" y="198">14</text>
      <text x="184" y="198">15</text>
      <text x="228" y="198">16</text>
      <text x="271" y="198">17</text>
      <rect x="298" y="180" width="34" height="26" rx="9" fill="#4f46e5" stroke="#91a8ff" stroke-width="1.5"/>
      <text x="315" y="198" fill="#ffffff" font-weight="700">18</text>
      <text x="358" y="198">19</text>

      <text x="98" y="220">20</text>
      <text x="141" y="220">21</text>
      <text x="184" y="220">22</text>
      <text x="228" y="220">23</text>
      <text x="271" y="220">24</text>
      <text x="315" y="220">25</text>
      <text x="358" y="220">26</text>

      <text x="98" y="242">27</text>
      <text x="141" y="242">28</text>
      <text x="184" y="242">29</text>
      <text x="228" y="242">30</text>
      <text class="outside" x="271" y="242">1</text>
      <text class="outside" x="315" y="242">2</text>
      <text class="outside" x="358" y="242">3</text>

      <text class="outside" x="98" y="264">4</text>
      <text class="outside" x="141" y="264">5</text>
      <text class="outside" x="184" y="264">6</text>
      <text class="outside" x="228" y="264">7</text>
      <text class="outside" x="271" y="264">8</text>
      <text class="outside" x="315" y="264">9</text>
      <text class="outside" x="358" y="264">10</text>
    </g>

    <!-- The rule turned with the layout: it used to sit above the time row, now it stands
         beside it and runs the calendar's height. -->
    <path d="M396 94v178" stroke="#2f333b"/>

    <!-- The row moved; it was not rearranged. Hour, Minute and Second stay across with their
         colons, exactly as in the time-only picker. -->
    <text class="field-label" x="412" y="102">Hour</text>
    <text class="field-label" x="468" y="102">Minute</text>
    <text class="field-label" x="524" y="102">Second</text>

    <rect x="412" y="108" width="40" height="28" rx="7" fill="#111318" stroke="#3b414c"/>
    <text class="field-value" x="432" y="127">08</text>
    <text class="muted" x="460" y="127" font-size="11" font-weight="700" text-anchor="middle">:</text>

    <rect x="468" y="108" width="40" height="28" rx="7" fill="#111318" stroke="#3b414c"/>
    <text class="field-value" x="488" y="127">45</text>
    <text class="muted" x="516" y="127" font-size="11" font-weight="700" text-anchor="middle">:</text>

    <rect x="524" y="108" width="40" height="28" rx="7" fill="#111318" stroke="#3b414c"/>
    <text class="field-value" x="544" y="127">30</text>

    <text x="80" y="312" fill="#a8afbc" font-size="10" font-weight="600">Today</text>
    <text x="428" y="312" fill="#a8afbc" font-size="10" font-weight="600">Clear</text>
    <rect x="476" y="292" width="88" height="28" rx="7" fill="#4f46e5"/>
    <text x="520" y="311" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">Apply</text>
  </g>
</svg>
