<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="A snackbar reporting a deleted message, offering an Undo action">
  <defs>
    <radialGradient id="glow" cx="12%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#4968e8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#4968e8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="#0f1115" />
  <rect width="640" height="360" fill="url(#glow)" />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="48" y="36" width="544" height="188" rx="18" fill="#171a20" stroke="#292d36" />
    <text x="76" y="74" fill="#a8afbc" font-size="13" font-weight="650">A message you can act on does not expire</text>
    <text x="76" y="104" fill="#a8afbc" font-size="12">No timer runs while an action is offered. It closes</text>
    <text x="76" y="122" fill="#a8afbc" font-size="12">when you choose, and not before.</text>

    <rect x="76" y="146" width="126" height="34" rx="9" fill="#1d2128" stroke="#3b414c" />
    <text x="139" y="168" fill="#f4f6fa" font-size="12" font-weight="620" text-anchor="middle">Delete message</text>

    <rect x="214" y="146" width="82" height="34" rx="9" fill="#1d2128" stroke="#3b414c" />
    <text x="255" y="168" fill="#f4f6fa" font-size="12" font-weight="620" text-anchor="middle">Publish</text>

    <rect x="150" y="266" width="340" height="56" rx="12" fill="#232c48" stroke="#7d8ab6" />

    <g stroke="#b9c8ff" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="180" cy="294" r="9" />
      <path d="M180 293v5M180 290h.01" />
    </g>

    <text x="202" y="299" fill="#b9c8ff" font-size="15">Message moved to Trash</text>
    <text x="404" y="299" fill="#b9c8ff" font-size="15" font-weight="700" text-decoration="underline">Undo</text>

    <g stroke="#b9c8ff" stroke-width="1.9" stroke-linecap="round">
      <path d="m456 289 10 10M466 289l-10 10" />
    </g>
  </g>
</svg>
