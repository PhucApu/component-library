<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="A book of stacked pages with one leaf caught halfway through a turn">
  <defs>
    <radialGradient id="flip-glow" cx="12%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#4968e8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#4968e8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="flip-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6c9a0" />
      <stop offset="100%" stop-color="#c9765a" />
    </linearGradient>
    <linearGradient id="flip-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fb3c9" />
      <stop offset="100%" stop-color="#39566b" />
    </linearGradient>
    <linearGradient id="flip-leaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b3644" />
      <stop offset="100%" stop-color="#586a7d" />
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="#0f1115" />
  <rect width="640" height="360" fill="url(#flip-glow)" />

  <rect x="48" y="34" width="544" height="292" rx="18" fill="#171a20" stroke="#292d36" />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="76" y="68" fill="#a8afbc" font-size="13" font-weight="650">A stack of pages, and one of them turning</text>

    <rect x="124" y="96" width="176" height="196" rx="10" fill="url(#flip-left)" stroke="#2e3440" />
    <g stroke="#2e3440" fill="#171a20">
      <rect x="344" y="102" width="176" height="196" rx="10" />
      <rect x="341" y="99" width="176" height="196" rx="10" />
    </g>
    <rect x="338" y="96" width="176" height="196" rx="10" fill="url(#flip-right)" stroke="#2e3440" />

    <path d="M310 104l64-14v212l-64-16z" fill="url(#flip-leaf)" stroke="#2e3440" />
    <path d="M310 104l64-14v212l-64-16z" fill="#000" opacity="0.28" />

    <rect x="306" y="96" width="8" height="196" fill="#0c0e13" opacity="0.7" />

    <g fill="#86a0ff">
      <circle cx="96" cy="194" r="12" opacity="0.35" />
      <circle cx="544" cy="194" r="12" opacity="0.35" />
      <path d="M99 189l-6 5 6 5" fill="none" stroke="#86a0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M541 189l6 5-6 5" fill="none" stroke="#86a0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
