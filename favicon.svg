<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Component UI Collection">
  <defs>
    <linearGradient id="cuc-badge" x1="16" y1="0" x2="16" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5c79ff" />
      <stop offset="1" stop-color="#3452cf" />
    </linearGradient>
  </defs>
  <!-- Brand badge: rounded square echoing the header brand mark -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="url(#cuc-badge)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.16" />
  <!-- "C" for Component / Collection, drawn as a bold open ring -->
  <path
    d="M22.18 10.01 A 7.6 7.6 0 1 0 22.18 21.99"
    fill="none"
    stroke="#f4f6fa"
    stroke-width="4.4"
    stroke-linecap="round"
  />
</svg>
